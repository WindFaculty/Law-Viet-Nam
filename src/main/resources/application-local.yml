spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lawrag}
    username: ${DB_USERNAME:lawrag}
    password: ${DB_PASSWORD:lawrag_local_dev}
  thymeleaf:
    cache: false

app:
  security:
    secure-cookies: ${SECURE_COOKIES:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      username: ${ADMIN_USERNAME:admin}
      display-name: ${ADMIN_DISPLAY_NAME:Quản trị viên}
      password: ${ADMIN_PASSWORD:Admin@12345}
  gemini:
    enabled: ${GEMINI_ENABLED:false}
  websearch:
    enabled: ${WEBSEARCH_ENABLED:false}
  ingestion:
    enabled: ${INGESTION_ENABLED:false}

logging:
  level:
    vn.edu.hsf302.lawrag: DEBUG
